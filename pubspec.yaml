name: green_market
description: "Green Market - Vegetable Import/Export & Wholesale Management"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  path_provider: ^2.1.0
  share_plus: ^9.0.0
  flutter_dotenv: ^5.1.0
  google_fonts: ^6.1.0
  fl_chart: ^0.68.0
  shimmer: ^3.0.0
  supabase_flutter: ^2.16.0
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5
  connectivity_plus: ^6.1.0
  pdf: ^3.12.0
  printing: ^5.13.1
  ming_cute_icons: ^0.0.8
  dropdown_button2: ^3.1.0
  icons_plus: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - .env

l10n:
  arb-dir: lib/l10n
  template-arb-file: app_en.arb
  output-localization-file: app_localizations.dart
  output-class: AppLocalizations
  nullable-getter: false
